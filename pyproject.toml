[project]
name = "math-teacher-api"
version = "0.1.0"
description = "AI-powered math tutoring backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "python-jose[cryptography]>=3.3.0",
    "pyjwt[crypto]>=2.10.0",
    "bcrypt>=4.2.0",
    "sentry-sdk[fastapi]>=2.19.0",
    # PINNED, not floored. Railway does NOT build from infra/Dockerfile —
    # it uses Railpack, whose start command is `pip install -e "."`. That
    # reads THIS file and ignores constraints.txt entirely, so a `>=` here
    # re-resolves to the newest release on every deploy AND every restart.
    # On 2026-09-03 that pulled anthropic 1.3.0, which dropped the
    # `temperature` kwarg from messages.create(); extraction, integrity and
    # AI grading all raised TypeError and no student homework could be
    # processed. TypeError isn't an APIError, so nothing was even logged as
    # a failed call. Keep this in lockstep with constraints.txt.
    "anthropic==0.116.0",
    "httpx>=0.28.0",
    "email-validator>=2.2.0",
    "slowapi>=0.1.9",
    "resend>=2.0.0",
    "stripe>=10.0.0",
    "pillow>=11.0.0",  # EXIF-transpose + downscale student photos before vision (api/core/image_utils) — RUNTIME dep, imported at app startup
]

[tool.setuptools.packages.find]
include = ["api*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
    "playwright>=1.49.0",  # autonomous browser harness (tests/harness)
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["api/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = ["integration: calls external APIs (Claude); requires real credentials and costs money"]
