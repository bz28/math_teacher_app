name: Improver scan

# Autonomous improver, laptop-off. Boots an EPHEMERAL stack (Postgres + API +
# web + headless Chromium) per run — no always-on server — scans the real app,
# files the ranked proposals as a GitHub issue, and persists the queue + budget
# ledger to the `improver/state` branch so dedupe + caps survive between runs.
#
# The improver makes NO deliberate metered API calls: `gather` is strictly $0
# (browser + detectors + screenshots + the product overview it hands the judge),
# and both the UI judging and the feature-gap ideation run on the Claude PLAN via
# the headless Claude Code step. Generation bugs stay covered by the separate $0
# prod-defect arm (llm_defects.py), not by re-running the live generator here.
#
# Repo secrets (Settings → Secrets → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN — `claude setup-token`; the judging + ideation run on
#     your Claude plan (included), not the API.
# (CLAUDE_API_KEY is intentionally NOT wired to the real secret — a dummy value is
#  set inline below so the FastAPI app can boot, which guarantees the improver can
#  never make a metered API call. Judging + ideation are plan-billed; gather is $0.)

on:
  schedule:
    - cron: "17 */6 * * *" # ~every 6h, off the :00 mark; budget ledger is the hard cap
  workflow_dispatch: # manual trigger for testing / on-demand scans
    inputs:
      max_surfaces:
        description: "Cap surfaces (0 = all); 23 = 12 public web + 5 admin + 6 demo"
        default: "23"

permissions:
  contents: write # push the improver/state branch
  issues: write # file the proposal digest

concurrency:
  group: improver-state # shared with improver-execute: never race the state branch
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_harness
      JWT_SECRET: improver-ephemeral-secret # consistent within the job (seed + API share it)
      CLAUDE_API_KEY: "improver-no-metered-calls" # dummy, NOT the real key — app needs a value to boot; guarantees $0 (any incidental call fails harmlessly instead of billing)
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }} # plan-billed judging
      APP_ENV: test
      SENTRY_DSN: ""
      HARNESS_LLM_MODE: auto
      HARNESS_API_BASE: http://localhost:8000/v1
      HARNESS_WEB_BASE: http://localhost:3000
      HARNESS_ADMIN_BASE: http://localhost:5173
      HARNESS_DEMO_BASE: http://127.0.0.1:4173
      IMPROVER_STATE_DIR: ${{ github.workspace }}/_improver_state
      NEXT_PUBLIC_API_URL: http://localhost:8000/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathapp
          POSTGRES_PASSWORD: mathapp
          POSTGRES_DB: mathapp_harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps + Chromium
        run: |
          pip install -e ".[dev]" -c constraints.txt
          python -m playwright install --with-deps chromium

      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Migrate the ephemeral harness DB
        run: alembic upgrade head

      - name: Build + start the web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          (pnpm start -p 3000 &) # served at :3000

      # Best-effort: the admin dashboard is lower-value than the web scan and a
      # separate build, so a dashboard build/boot failure must NOT sink the run
      # — continue-on-error keeps the web scan alive; admin surfaces then just
      # record per-surface errors (caught in scan_surfaces).
      - name: Build + serve the admin dashboard
        working-directory: dashboard
        continue-on-error: true
        run: |
          npm ci
          npm run build                       # VITE_API_URL defaults to :8000/v1, which matches
          (npm run preview -- --port 5173 --host 127.0.0.1 &) # served at :5173

      # Best-effort, same contract as the admin build: the demo is a standalone
      # zero-auth Vite SPA (no API/db). `vite preview` history-falls-back to
      # index.html, so the deep client-side routes (/present/integrity, …) serve
      # fine. A demo build/boot failure just records per-surface errors — the web
      # scan continues.
      - name: Build + serve the demo app
        working-directory: demo
        continue-on-error: true
        run: |
          npm ci
          npm run build
          (npm run preview -- --port 4173 --host 127.0.0.1 &) # served at :4173

      - name: Start the API (harness DB, cassette mode)
        run: (python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --log-level warning &)

      - name: Wait for API + web (dashboard + demo best-effort)
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/v1/health >/dev/null 2>&1 \
               && curl -sf http://localhost:3000 >/dev/null 2>&1; then
              ok=1; echo "api+web up"; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "api/web did not come up in time"; exit 1; }
          # Dashboard is best-effort — warn but never fail the run if it's down.
          dash=0
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5173 >/dev/null 2>&1; then dash=1; echo "dashboard up"; break; fi
            sleep 2
          done
          [ "$dash" = 1 ] || echo "::warning::admin dashboard not up — admin surfaces skipped/errored; web scan continues"
          # Demo is best-effort too — warn but never fail the run if it's down.
          demo=0
          for i in $(seq 1 10); do
            if curl -sf http://127.0.0.1:4173 >/dev/null 2>&1; then demo=1; echo "demo up"; break; fi
            sleep 2
          done
          [ "$demo" = 1 ] || echo "::warning::demo app not up — demo surfaces skipped/errored; web scan continues"

      - name: Restore queue + ledger from improver/state
        run: |
          mkdir -p "$IMPROVER_STATE_DIR"
          if git fetch origin improver/state 2>/dev/null; then
            git show origin/improver/state:proposals.json > "$IMPROVER_STATE_DIR/proposals.json" 2>/dev/null || true
            git show origin/improver/state:ledger.json    > "$IMPROVER_STATE_DIR/ledger.json"    2>/dev/null || true
          fi

      # Plan-billed scan, in three steps so the "intelligence" runs on your
      # Claude plan, not the metered API: gather ($0) → judge (plan) → ingest.
      - name: Gather evidence ($0 — browser + detectors + screenshots, no LLM)
        run: |
          python -m tests.harness improve gather \
            --dir "$IMPROVER_STATE_DIR/evidence" --apps web,admin,demo \
            --max-surfaces "${{ github.event.inputs.max_surfaces || '23' }}"

      - name: Judge on the Claude plan (Claude Code headless)
        working-directory: ${{ env.IMPROVER_STATE_DIR }}/evidence
        run: |
          npm install -g @anthropic-ai/claude-code
          # Reads findings.json + shots/, writes proposals.json (billed to the plan).
          claude -p "$(cat JUDGE_PROMPT.txt)" \
            --dangerously-skip-permissions --allowedTools "Read Write Bash"

      - name: Ingest plan-judged proposals (rank, dedupe, queue)
        env:
          # PROD_API_BASE must include the /v1 prefix (e.g.
          # https://…up.railway.app/v1) — the route is /v1/admin/harness-runs/
          # ingest, and a missing /v1 silently 404s every POST.
          INGEST_URL: ${{ vars.PROD_API_BASE }}
          HARNESS_INGEST_TOKEN: ${{ secrets.HARNESS_INGEST_TOKEN }}
        run: |
          # CI can't open a Postgres connection to prod, so --summary-db "" and
          # POST the run summary to the admin ingest endpoint over HTTPS instead
          # (populates the "Harness Runs" tab). Only when both URL + token are
          # set, so the scan never fails on a half-configured repo.
          ARGS=(--dir "$IMPROVER_STATE_DIR/evidence" --summary-db "")
          if [ -n "$INGEST_URL" ] && [ -n "$HARNESS_INGEST_TOKEN" ]; then
            ARGS+=(--summary-url "$INGEST_URL/admin/harness-runs/ingest")
          fi
          python -m tests.harness improve ingest "${ARGS[@]}"
          cp -f "$IMPROVER_STATE_DIR/evidence/findings.json" "$IMPROVER_STATE_DIR/" 2>/dev/null || true

      - name: Upload the scan evidence (screenshots + findings + proposals)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: improver-evidence
          path: ${{ env.IMPROVER_STATE_DIR }}/evidence
          if-no-files-found: ignore

      # Publish the current run's surface screenshots so the issue can embed them.
      # A dedicated orphan branch (single force-pushed commit of only the current
      # PNGs, named <proposal_id>.png) that GitHub serves as raw images — it never
      # grows unbounded, and a demo/vercel.json written into the branch (below)
      # opts it out of Vercel. Best-effort: an image-publish hiccup must not
      # sink the digest (the digest just omits missing images).
      - name: Stage + publish proposal screenshots
        if: success()
        continue-on-error: true
        run: |
          SHOT_DIR="$IMPROVER_STATE_DIR/shots_by_id"
          rm -rf "$SHOT_DIR"
          python -m tests.harness improve screenshots \
            --dir "$IMPROVER_STATE_DIR/evidence" --out "$SHOT_DIR"
          if ls "$SHOT_DIR"/*.png >/dev/null 2>&1; then
            TMP=$(mktemp -d)
            cp -f "$SHOT_DIR"/*.png "$TMP/"
            git -C "$TMP" init -q
            git -C "$TMP" config user.name "improver-bot"
            git -C "$TMP" config user.email "improver@users.noreply.github.com"
            git -C "$TMP" checkout -q -b improver-screenshots-tmp
            # Vercel reads deploymentEnabled from the pushed branch's
            # demo/vercel.json, so ship the opt-out here or Vercel errors on
            # this demo-less branch and emails a failed deploy every push.
            mkdir -p "$TMP/demo"
            printf '%s\n' '{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":{"improver/*":false}}}' > "$TMP/demo/vercel.json"
            git -C "$TMP" add -A
            git -C "$TMP" commit -q -m "improver screenshots $(date -u +%FT%TZ)" || exit 0
            git -C "$TMP" push -f \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              improver-screenshots-tmp:improver/screenshots
          else
            echo "no screenshots staged — digest will render without images"
          fi

      - name: File the proposal digest as an issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIGEST=$(python -m tests.harness improve digest \
            --screenshot-dir "$IMPROVER_STATE_DIR/shots_by_id" \
            --screenshot-base-url "${{ github.server_url }}/${{ github.repository }}/raw/improver/screenshots" \
            2>/dev/null || true)
          # Broken user journeys aren't proposals (the agent can't edit
          # auth/billing) — they ride along as a human alert at the top.
          ALERT=$(python -m tests.harness improve flow-alert --dir "$IMPROVER_STATE_DIR/evidence" 2>/dev/null || true)
          NO_PROPOSALS=$( { [ -z "$DIGEST" ] || echo "$DIGEST" | grep -q "No open proposals"; } && echo 1 || echo "" )
          if [ -n "$NO_PROPOSALS" ] && [ -z "$ALERT" ]; then
            echo "no proposals and no broken journeys — leaving the backlog as-is"; exit 0
          fi
          # Upsert the single living "Improver backlog" issue (carry-forward:
          # the body is the WHOLE open queue, rewritten in place each run). The
          # broken-journey alert goes via ALERT_BODY → a COMMENT, so the later
          # LLM-defect scan's body overwrite can't clobber it.
          printf 'Open improver proposals — refreshed %s. Comment `approve <id>` to ship one (opens a PR, never merges) or `reject <id>` to drop it. Unfixed proposals carry forward here until you act on them. Full screenshot report is in the latest scan run artifacts.\n\n%s' \
            "$(date -u +%Y-%m-%dT%H:%MZ)" "$DIGEST" \
            | ALERT_BODY="$ALERT" bash tests/harness/improver/file_backlog.sh

      - name: Persist queue + ledger to improver/state
        if: always()
        run: |
          git config user.name "improver-bot"
          git config user.email "improver@users.noreply.github.com"
          TMP=$(mktemp -d)
          cp -f "$IMPROVER_STATE_DIR"/proposals.json "$TMP/" 2>/dev/null || true
          cp -f "$IMPROVER_STATE_DIR"/ledger.json    "$TMP/" 2>/dev/null || true
          git checkout --orphan improver-state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          cp -f "$TMP"/*.json . 2>/dev/null || true
          # Opt this demo-less orphan branch out of Vercel (read from the pushed
          # branch's demo/vercel.json) so it doesn't error + email every push.
          mkdir -p demo
          printf '%s\n' '{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":{"improver/*":false}}}' > demo/vercel.json
          git add -A
          git commit -m "improver state $(date -u +%FT%TZ)" >/dev/null 2>&1 || { echo "nothing to persist"; exit 0; }
          git push -f origin improver-state-tmp:improver/state
