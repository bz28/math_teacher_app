name: Improver explore (grow corpus)

# Feeds the improver's CONTENT-QUALITY arm. That arm proposes fixes for
# AI-generation defects drawn from the promoted-failure corpus
# (tests/harness/_corpus/*.json) — but the corpus only grows when something
# promotes failures into it, and nothing did, so it sat at one passing case and
# the content arm had zero input.
#
# This job runs `explore` on a timer: generate fresh scenarios, run them against
# an ephemeral app, and promote any that fail into the corpus. If the corpus
# changed it opens a PR (never pushes to main) — review + merge, then the next
# scan's content arm has real material to propose from.
#
# Billed to the app's CLAUDE_API_KEY (scenario generation + the app's own LLM
# calls). Cadence is deliberately conservative; bump it once it's proven.

on:
  schedule:
    - cron: "0 9 * * 1" # weekly, Monday 09:00 UTC — explore is billed, not $0
  workflow_dispatch:
    inputs:
      scenarios:
        description: "How many scenarios to generate"
        default: "8"
      probe:
        description: "Probe to explore"
        default: "geometry"

permissions:
  contents: write # push the corpus branch
  pull-requests: write # open the corpus-growth PR

jobs:
  explore:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_harness
      JWT_SECRET: improver-ephemeral-secret
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      APP_ENV: test
      SENTRY_DSN: ""
      HARNESS_LLM_MODE: auto
      HARNESS_API_BASE: http://localhost:8000/v1
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathapp
          POSTGRES_PASSWORD: mathapp
          POSTGRES_DB: mathapp_harness
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # explore drives the API only (probe.generate hits api_base; it never
      # opens a browser or the web app), so no Playwright/Chromium, no Node, no
      # web build — unlike the UI scan. Just Python + the API.
      - name: Install Python deps
        run: pip install -e ".[dev]"

      - name: Migrate the ephemeral harness DB
        run: alembic upgrade head

      - name: Start the API (harness DB, cassette mode)
        run: (python -m uvicorn api.main:app --host 0.0.0.0 --port 8000 --log-level warning &)

      - name: Wait for API
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8000/v1/health >/dev/null 2>&1; then
              ok=1; echo "api up"; break
            fi
            sleep 3
          done
          [ "$ok" = 1 ] || { echo "api did not come up in time"; exit 1; }

      - name: Explore — generate, run, promote failures to the corpus
        run: |
          # --summary-db "" : CI can't reach the prod DB; the corpus growth (a
          # committed file) is the durable output, not the dashboard row.
          python -m tests.harness explore \
            --probe "${{ github.event.inputs.probe || 'geometry' }}" \
            --mode auto \
            --scenarios "${{ github.event.inputs.scenarios || '8' }}" \
            --summary-db ""

      - name: Open a PR if the corpus grew
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- tests/harness/_corpus; then
            echo "corpus unchanged — generator held up, nothing to promote"; exit 0
          fi
          STAMP=$(date -u +%Y%m%d-%H%M%S)
          BRANCH="improver/corpus-${STAMP}"
          git config user.name "improver-bot"
          git config user.email "improver@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add tests/harness/_corpus
          git commit \
            -m "chore(harness): promote explored failures to the corpus ($STAMP)" \
            -m "Auto-promoted by the scheduled improver-explore job; these newly-failing generation scenarios feed the improver's content-quality arm. Review the cases, then merge so the next scan can propose fixes for them."
          git push -u origin "$BRANCH"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --title "chore(harness): grow generation-failure corpus ($STAMP)" \
            --body "Scheduled \`explore\` promoted new generation failures into \`tests/harness/_corpus\`. Each case is a scenario the live generator got wrong; merging gives the improver's content-quality arm material to propose fixes from. Review the diff before merging." \
            --assignee "$GITHUB_REPOSITORY_OWNER" || echo "PR create skipped"
