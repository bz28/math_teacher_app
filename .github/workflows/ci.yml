name: CI

on:
  push:
    branches: [main]
  # Every PR, not just PRs into main.
  #
  # This was `branches: [main]` from the first CI commit, back when
  # every PR went straight to main. That stopped being true once we
  # started stacking: a PR based on another PR's branch matched none
  # of the filters, so it got NO backend, dashboard or mobile run at
  # all — it sat there looking unverified-but-fine, and would have
  # merged on nothing but its author's say-so.
  #
  # Omitting `branches` is also the GitHub default; the filter was the
  # deliberate part. Duplicate runs aren't a concern here because the
  # `push` trigger is still limited to main.
  pull_request:

permissions:
  contents: read
  pull-requests: read # dorny/paths-filter lists a PR's files through the API

# The account runs ~2 Actions jobs at once, so a superseded run on a PR
# branch is pure queue time for everything behind it: cancel it. Main is
# different — Railway deploys a main commit once its checks pass, so every
# main push must run to the end. Grouping main by SHA gives each push its
# own group; grouping it by ref would let a third push replace the second
# while it waits, and that commit would never get checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which parts of the repo a PR touches, so each job below runs only when
  # something it checks changed. A push to main skips this and runs every
  # job. A job skipped by its `if:` reports success, so the required checks
  # (backend, web, mobile, dashboard) still pass on a PR that didn't need
  # them. If this job itself fails, every job runs: fail open, never skip
  # a check because the filter broke.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      prod_deps: ${{ steps.filter.outputs.prod_deps }}
      web: ${{ steps.filter.outputs.web }}
      mobile: ${{ steps.filter.outputs.mobile }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            backend:
              - *ci
              - api/**
              - tests/**
              - scripts/**
              - pyproject.toml
              - constraints.txt
              - alembic.ini
              # The OpenAPI staleness check diffs the spec the app generates
              # against this committed copy.
              - mobile/openapi.json
              # Frontend files that backend tests read to check the two
              # sides agree (test_activity_action_registry_parity,
              # test_generation_limits_mirrored, test_generation_params).
              - dashboard/src/lib/activityActions.ts
              - web/src/lib/constants.ts
              - web/src/components/school/teacher/_pieces/generation-params-options.ts
            prod_deps:
              - *ci
              - api/**
              # constraints.txt is left out on purpose: this job mirrors
              # Railway, which never reads it.
              - pyproject.toml
            web:
              - *ci
              - web/**
              # `pnpm gen:api` generates the web client from the mobile spec.
              - mobile/openapi.json
            mobile:
              - *ci
              - mobile/**
            dashboard:
              - *ci
              - dashboard/**

  prod-deps-smoke:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.prod_deps == 'true') }}
    # Guards against a dev-only dependency leaking into the app's runtime import
    # chain. The `backend` job installs `.[dev]`, so it can't catch this — but
    # Railway installs only `[project.dependencies]`. Mirror prod: install
    # WITHOUT [dev] and import the app entrypoint. (This is exactly how the
    # PIL/pillow prod boot crash slipped through CI once.)
    #
    # Mirror it PROPERLY. This job used to run `pip install . -c
    # constraints.txt` on Python 3.12, and neither matched production:
    # Railway builds with Railpack, whose start command is
    # `pip install -e "."` on its default Python 3.13 — constraints.txt is
    # never read. So the job installed pinned deps while prod installed
    # floating ones, and stayed green through the 2026-09-03 outage where
    # anthropic floated to 1.3.0. Resolving exactly what prod resolves is
    # the whole point of the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Railpack's default, not ours. See above.
          python-version: "3.13"
          # Caches downloaded wheels only: pip still resolves against the
          # index every run, so floating versions float here as on Railway.
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install production dependencies only (no [dev], no constraints)
        run: pip install .
      - name: App imports with production deps only
        env:
          DATABASE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: python -c "import api.main; print('app imports cleanly with production deps only')"

  backend:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.backend == 'true') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathapp
          POSTGRES_PASSWORD: mathapp
          POSTGRES_DB: mathapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install dependencies
        run: pip install -e ".[dev]" -c constraints.txt

      # Before the upgrade, not after: with two heads `alembic upgrade
      # head` fails on its own, so a check placed after it can never
      # run. This exists to name the problem ("two branch tips") instead
      # of leaving alembic's message about narrowing to a branch.
      # Counts lines, not "(head)" markers — a head reached via
      # depends_on prints "(effective head)" and would slip past a grep
      # for the literal "(head)".
      - name: Single migration head
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c . || true)
          test "$heads" -eq 1 \
            || { echo "::error::$heads alembic heads — two migration branch tips exist. Rebase one onto the other so there is a single linear history."; exit 1; }

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: alembic upgrade head

      # Migrations and models must agree. Without this, a model change
      # that never got a migration passes CI silently — the test suite
      # builds its schema from the models, so it never notices — and a
      # promised follow-up migration can be forgotten entirely. Both had
      # already happened by the time this step was added.
      #
      # Known blind spots, so nobody over-trusts a green check:
      #   * server defaults — `compare_server_default=True` is not
      #     usable here: these models declare Python-side `default=`, so
      #     enabling it reports every real DB default as drift (47 false
      #     positives on a clean schema).
      #   * CHECK constraints — alembic does not reflect or diff them at
      #     all, and this codebase encodes enum-ish values that way
      #     (e.g. ck_schools_kind).
      #   * partial-index predicates — a WHERE clause difference is
      #     invisible, in both directions.
      - name: Migrations match the models
        env:
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: |
          alembic check \
            || { echo "::error::The models and the migrations disagree. Either a model change is missing its migration (write one), or a migration created something the models do not declare (declare it — see api/models/grading_job.py for the __table_args__ pattern). Do NOT blindly commit 'alembic revision --autogenerate' output: for the second case it emits a DROP for the object you just added."; exit 1; }

      - name: Lint
        run: ruff check api/ tests/

      - name: Type check
        run: mypy api/ --ignore-missing-imports

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        # One worker per CPU, each in a database of its own
        # (tests/xdist_db.py). Serial, this step took ~20 min.
        run: pytest tests/ -n auto -v -m "not integration"

      - name: OpenAPI spec is up to date
        env:
          # database_url is required by Settings at import; a dummy value is
          # fine — app.openapi() never connects.
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: |
          python -m scripts.dump_openapi
          git diff --exit-code mobile/openapi.json \
            || { echo "::error::mobile/openapi.json is stale — run 'python -m scripts.dump_openapi' and commit."; exit 1; }

  mobile:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.mobile == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 to satisfy @testing-library/react-native@14's engine floor (^22.13 || >=24).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Test
        working-directory: mobile
        run: npx jest --ci

      - name: API types match the spec
        working-directory: mobile
        run: |
          npm run gen:api
          git diff --exit-code src/services/api-schema.gen.ts \
            || { echo "::error::mobile/src/services/api-schema.gen.ts is stale — run 'npm run gen:api' and commit."; exit 1; }

  web:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the unit tests are plain `node --test` over .ts
          # files, which needs native type-stripping (>=22.6). The mobile
          # job above already runs 22. Nothing here pins a Node version
          # for the deployed build — Vercel picks its own — so this only
          # moves the CI check, and `pnpm build` is verified on 22+.
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      # Web unit tests did not run in CI at all until now, which is how a
      # 401-handling regression reached production and logged students
      # out every 15 minutes for weeks.
      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

      - name: API types match the spec
        working-directory: web
        run: |
          pnpm gen:api
          git diff --exit-code src/lib/api-schema.gen.ts \
            || { echo "::error::web/src/lib/api-schema.gen.ts is stale — run 'pnpm gen:api' and commit."; exit 1; }

  dashboard:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.result != 'success' || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22, not 20: the dashboard unit tests are plain `node --test`
          # over .ts files, which needs native type-stripping (>=22.6) —
          # the same reason the web job pins 22. Nothing here pins a Node
          # version for the deployed build.
          node-version: "22"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      # The Costs pages' pure pieces (drill targets, money formats, and
      # the margin arithmetic) land in pricing conversations; nothing in
      # CI failed when they broke.
      - name: Test
        working-directory: dashboard
        run: npm test

      - name: Build
        working-directory: dashboard
        run: npm run build
