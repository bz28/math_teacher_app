name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  prod-deps-smoke:
    # Guards against a dev-only dependency leaking into the app's runtime import
    # chain. The `backend` job installs `.[dev]`, so it can't catch this — but
    # Railway installs only `[project.dependencies]`. Mirror prod: install
    # WITHOUT [dev] and import the app entrypoint. (This is exactly how the
    # PIL/pillow prod boot crash slipped through CI once.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install production dependencies only (no [dev])
        run: pip install .
      - name: App imports with production deps only
        env:
          DATABASE_URL: postgresql+asyncpg://x:x@localhost:5432/x
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: python -c "import api.main; print('app imports cleanly with production deps only')"

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathapp
          POSTGRES_PASSWORD: mathapp
          POSTGRES_DB: mathapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations
        env:
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: alembic upgrade head

      - name: Lint
        run: ruff check api/ tests/

      - name: Type check
        run: mypy api/ --ignore-missing-imports

      - name: Test
        env:
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: pytest tests/ -v -m "not integration"

      - name: OpenAPI spec is up to date
        env:
          # database_url is required by Settings at import; a dummy value is
          # fine — app.openapi() never connects.
          DATABASE_URL: postgresql+asyncpg://mathapp:mathapp@localhost:5432/mathapp_test
          JWT_SECRET: ci-test-secret
          CLAUDE_API_KEY: sk-ant-ci-fake-key
          APP_ENV: test
          SENTRY_DSN: ""
        run: |
          python -m scripts.dump_openapi
          git diff --exit-code mobile/openapi.json \
            || { echo "::error::mobile/openapi.json is stale — run 'python -m scripts.dump_openapi' and commit."; exit 1; }

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 to satisfy @testing-library/react-native@14's engine floor (^22.13 || >=24).
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Test
        working-directory: mobile
        run: npx jest --ci

      - name: API types match the spec
        working-directory: mobile
        run: |
          npm run gen:api
          git diff --exit-code src/services/api-schema.gen.ts \
            || { echo "::error::mobile/src/services/api-schema.gen.ts is stale — run 'npm run gen:api' and commit."; exit 1; }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Build
        working-directory: web
        run: pnpm build

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        run: npm run build
