name: Improver LLM-defect scan

# Channel A: the production-defect arm of the autonomous improver. On a timer it
# asks the BACKEND (which holds the prod DB) for recent defective LLM calls —
# failures + the control-char corruption fingerprint (the LaTeX-class bug) —
# turns each recurring defect into ONE proposal, and files them for approval.
# Prod DB credentials never leave the backend: this job only holds a static
# service key. State (queue + budget ledger + the incremental watermark) lives
# on the `improver/state` branch, same as the UI scan.
#
# Config (Settings → Secrets and variables → Actions):
#   IMPROVER_API_KEY (secret)   — the static service key, matching the backend's
#                                 `improver_api_key` setting (X-Improver-Key auth).
#   PROD_API_BASE (variable)    — the prod API root incl. /v1; shared with the
#                                 harness-runs ingest feature (a repo *variable*,
#                                 not a secret — it's not sensitive).
# Until both are set the job no-ops (the CLI skips when the key is absent).

on:
  schedule:
    - cron: "37 */6 * * *" # offset from the UI scan; ledger is the hard cap
  workflow_dispatch:
    inputs:
      hours:
        description: "Window (h) to scan when no watermark exists yet"
        default: "24"

permissions:
  contents: write # push the improver/state branch
  issues: write # file the proposal digest

concurrency:
  group: improver-state # shared with the UI scan + execute: never race the state branch
  cancel-in-progress: false

jobs:
  llm-scan:
    runs-on: ubuntu-latest
    env:
      # The harness imports api.config at startup, which needs these present;
      # this job makes NO LLM calls, so they're inert placeholders.
      JWT_SECRET: improver-ephemeral-secret
      CLAUDE_API_KEY: unused-no-llm-in-this-job
      APP_ENV: test
      IMPROVER_STATE_DIR: ${{ github.workspace }}/_improver_state
      IMPROVER_API_KEY: ${{ secrets.IMPROVER_API_KEY }}
      PROD_API_BASE: ${{ vars.PROD_API_BASE }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      - name: Restore queue + ledger + watermark from improver/state
        run: |
          mkdir -p "$IMPROVER_STATE_DIR"
          if git fetch origin improver/state 2>/dev/null; then
            for f in proposals.json ledger.json llm_watermark.txt; do
              git show "origin/improver/state:$f" > "$IMPROVER_STATE_DIR/$f" 2>/dev/null || true
            done
          fi

      - name: Skip if not configured
        id: gate
        run: |
          if [ -z "$IMPROVER_API_KEY" ] || [ -z "$PROD_API_BASE" ]; then
            echo "IMPROVER_API_KEY / PROD_API_BASE not set — feature off; skipping."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mine prod LLM-call defects → proposals
        if: steps.gate.outputs.configured == 'true'
        run: |
          python -m tests.harness improve llm-scan \
            --dir "$IMPROVER_STATE_DIR/evidence" \
            --api-base "$PROD_API_BASE" \
            --hours "${{ github.event.inputs.hours || '24' }}"

      - name: Ingest proposals (rank, dedupe, queue)
        if: steps.gate.outputs.configured == 'true'
        run: |
          python -m tests.harness improve ingest \
            --dir "$IMPROVER_STATE_DIR/evidence" --summary-db ""

      - name: File the proposal digest as an issue
        if: steps.gate.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DIGEST=$(python -m tests.harness improve digest 2>/dev/null || true)
          if [ -z "$DIGEST" ] || echo "$DIGEST" | grep -q "No open proposals"; then
            echo "no open proposals — leaving the backlog as-is"; exit 0
          fi
          # Upsert the single shared "Improver backlog" issue — both channels
          # write to one queue, so `improve digest` is the whole open backlog.
          printf 'Open improver proposals — refreshed %s. Comment `approve <id>` to ship one (opens a PR, never merges) or `reject <id>` to drop it. Unfixed proposals carry forward here until you act on them.\n\n%s' \
            "$(date -u +%Y-%m-%dT%H:%MZ)" "$DIGEST" \
            | bash tests/harness/improver/file_backlog.sh

      # The watermark rides on the shared improver/state branch. The UI scan /
      # execute orphan-commit only proposals.json + ledger.json, so they may wipe
      # the watermark — which is fine: it's an optimization, not a correctness
      # guarantee. A wiped watermark just falls back to the --hours window next
      # run, and content-signature dedup suppresses anything already queued.
      - name: Persist queue + ledger + watermark to improver/state
        if: always()
        run: |
          git config user.name "improver-bot"
          git config user.email "improver@users.noreply.github.com"
          TMP=$(mktemp -d)
          for f in proposals.json ledger.json llm_watermark.txt; do
            cp -f "$IMPROVER_STATE_DIR/$f" "$TMP/" 2>/dev/null || true
          done
          git checkout --orphan improver-state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          cp -f "$TMP"/*.json "$TMP"/*.txt . 2>/dev/null || true
          # Opt this demo-less orphan branch out of Vercel (read from the pushed
          # branch's demo/vercel.json) so it doesn't error + email every push.
          mkdir -p demo
          printf '%s\n' '{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":{"improver/*":false}}}' > demo/vercel.json
          git add -A
          git commit -m "improver state $(date -u +%FT%TZ)" >/dev/null 2>&1 || { echo "nothing to persist"; exit 0; }
          git push -f origin improver-state-tmp:improver/state
