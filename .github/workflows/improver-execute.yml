name: Improver execute

# Option A — hands-off coding. When YOU comment `approve <id>` on an improver
# proposal issue, this runs Claude Code headless to implement that one approved
# proposal and open a DRAFT PR (never merges). You already confirmed the
# approach by approving the bullet plan; you stay the final gate at PR review.
#
# Auth: the coding agent IS Claude Code, which is included in your Claude plan —
# so it runs on a long-lived plan token (CLAUDE_CODE_OAUTH_TOKEN from
# `claude setup-token`), NOT the metered API key. No per-token charge on top of
# the plan you already pay for; runs are infrequent (approval-gated + 8/week
# cap) so they won't exhaust the limit. (The scan can't use the plan — it makes
# raw Anthropic SDK calls, which only accept an API key — so it stays on the
# cheap metered key.)
#
# NOTE: headless coding-in-CI is the one part not yet shake-down tested (it
# can't be dispatched until the workflow is on the default branch). Expect to
# iterate it on the first real run.

on:
  issue_comment:
    types: [created]

# Shared with improver-scan so a scan and an execute never race the
# improver/state branch (force-push would clobber the other's ledger/queue).
concurrency:
  group: improver-state
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  execute:
    # Only on an improver-labelled issue, only a comment from the repo owner,
    # only when it starts with "approve " — so a random commenter can never
    # trigger an autonomous coding run.
    if: >-
      contains(join(github.event.issue.labels.*.name, ','), 'improver') &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, 'approve ')
    runs-on: ubuntu-latest
    env:
      # The coding agent bills your Claude PLAN, not the API (see header).
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      IMPROVER_STATE_DIR: ${{ github.workspace }}/_improver_state
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the fix may branch off a non-default base

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" -c constraints.txt

      - name: Acknowledge
        run: gh issue comment "${{ github.event.issue.number }}" --body "On it — implementing and opening a draft PR. 🤖"

      - name: Restore queue from improver/state
        run: |
          mkdir -p "$IMPROVER_STATE_DIR"
          git fetch origin improver/state 2>/dev/null || true
          git show origin/improver/state:proposals.json > "$IMPROVER_STATE_DIR/proposals.json" 2>/dev/null || true
          git show origin/improver/state:ledger.json    > "$IMPROVER_STATE_DIR/ledger.json"    2>/dev/null || true

      - name: Approve + build the execution brief
        id: brief
        env:
          COMMENT_BODY: ${{ github.event.comment.body }} # via env, never inlined into the shell
          # `improve approve`/`execute` import the harness, which imports
          # api.config.Settings — that validates these fields at import time even
          # though approve/execute make NO database or LLM calls (they only read
          # the queue and write a brief). Placeholders satisfy the import;
          # nothing connects. Without them the step crashed on a Settings
          # ValidationError and no PR was ever opened.
          #
          # Deliberately step-scoped, NOT job-level: a real CLAUDE_API_KEY in the
          # `claude -p` step could make the coding agent bill the metered API
          # instead of the plan token (CLAUDE_CODE_OAUTH_TOKEN). Keep it here.
          DATABASE_URL: postgresql+asyncpg://placeholder/unused
          JWT_SECRET: improver-execute-unused
          CLAUDE_API_KEY: unused-no-llm-calls-in-this-step
        run: |
          # tr -cd keeps only hex so the id is safe; COMMENT_BODY comes in as an
          # env var (never inlined into this script) — that closes the
          # script-injection hole.
          ID=$(printf '%s' "$COMMENT_BODY" | awk '{print $2}' | tr -cd 'a-f0-9')
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          python -m tests.harness improve approve "$ID" || true
          # `improve execute` is budget-gated; it prints the subagent brief.
          python -m tests.harness improve execute "$ID" > "$IMPROVER_STATE_DIR/brief.txt"
          test -s "$IMPROVER_STATE_DIR/brief.txt" || { echo "no brief (blocked or unknown id)"; exit 1; }

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Implement headless + open draft PR
        run: |
          BRIEF=$(cat "$IMPROVER_STATE_DIR/brief.txt")
          PROMPT="$BRIEF

          You are running in GitHub Actions (non-interactive). Use \`gh\` (GH_TOKEN is set) to open a DRAFT PR. Post a short explain-simple bullet summary of the plan as the PR description. Do not merge. If you cannot keep the change small/safe, comment that on issue #${{ github.event.issue.number }} and stop."
          claude -p "$PROMPT" --dangerously-skip-permissions --allowedTools "Bash Edit Write Read" 2>&1 | tee /tmp/claude.out

      - name: Mark done + report back
        if: always()
        env:
          # PROD_API_BASE must include the /v1 prefix — see improver-scan.yml.
          INGEST_URL: ${{ vars.PROD_API_BASE }}
          HARNESS_INGEST_TOKEN: ${{ secrets.HARNESS_INGEST_TOKEN }}
        run: |
          ID="${{ steps.brief.outputs.id }}"
          # Resolve the PR first so `improve done` can record it on the admin
          # "Harness Runs" row (over HTTPS — CI can't reach prod Postgres).
          PR=$(gh pr list --search "improver/$ID in:head" --json url --jq '.[0].url' 2>/dev/null || true)
          DONE_ARGS=("$ID" --pr "$PR")
          if [ -n "$INGEST_URL" ] && [ -n "$HARNESS_INGEST_TOKEN" ]; then
            DONE_ARGS+=(--summary-url "$INGEST_URL/admin/harness-runs/ingest")
          fi
          python -m tests.harness improve done "${DONE_ARGS[@]}" 2>/dev/null || true
          gh issue comment "${{ github.event.issue.number }}" --body "Execution for \`$ID\` finished. ${PR:+PR: $PR}${PR:-(no PR opened — see the run log)}"

      - name: Persist queue + ledger to improver/state
        if: always()
        run: |
          git config user.name "improver-bot"
          git config user.email "improver@users.noreply.github.com"
          TMP=$(mktemp -d)
          cp -f "$IMPROVER_STATE_DIR"/proposals.json "$TMP/" 2>/dev/null || true
          cp -f "$IMPROVER_STATE_DIR"/ledger.json    "$TMP/" 2>/dev/null || true
          git checkout --orphan improver-state-tmp
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -not -name '.git' -not -name '.' -exec rm -rf {} + 2>/dev/null || true
          cp -f "$TMP"/*.json . 2>/dev/null || true
          # Vercel deploys every pushed branch and the veradic-demo project
          # builds from demo/. This orphan branch has no demo/, so Vercel errors
          # ("Root Directory does not exist") and emails a failed deploy on every
          # push. Vercel reads deploymentEnabled from the *pushed* branch's
          # demo/vercel.json (not main's), so ship the opt-out on the branch.
          mkdir -p demo
          printf '%s\n' '{"$schema":"https://openapi.vercel.sh/vercel.json","git":{"deploymentEnabled":{"improver/*":false}}}' > demo/vercel.json
          git add -A && git commit -m "improver state $(date -u +%FT%TZ)" >/dev/null 2>&1 || exit 0
          git push -f origin improver-state-tmp:improver/state
