# Railway deploy settings for the API service (config as code: these
# override the service's dashboard settings on every deploy).

[build]
builder = "RAILPACK"

[deploy]
# The dashboard's start command, with `exec` so uvicorn replaces the
# shell and receives Railway's SIGTERM itself (graceful shutdown runs).
startCommand = 'pip install -e "." && python -m alembic upgrade head && exec python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT'

# Railway sends traffic to a new deployment only once this answers 200,
# and keeps the old one serving until then. Without it, traffic moved
# while the new container was still installing and migrating, and every
# deploy was a stretch of 502s. /v1/health also runs `SELECT 1`, so a
# deployment that can't reach the database never takes traffic. The
# timeout covers the install + migrations in the start command.
# The old deployment keeps serving while the new one migrates, so a
# migration must work with the code before it (expand, then contract).
healthcheckPath = "/v1/health"
healthcheckTimeout = 300

# Time between SIGTERM and SIGKILL for the old deployment, so uvicorn can
# finish in-flight requests and run lifespan shutdown (which waits up to
# 30s for streamed integrity turns, #994). Detached asyncio tasks that are
# still running when shutdown completes are cancelled, as before.
drainingSeconds = 45

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
